equipamentos:
  inversor_principal:
    tipo: inversor
    host: 192.168.0.10
    porta: 502
    timeout: 3.0
    device_id: 1
    registradores:
      tensao:
        endereco: 0
        quantidade: 1
      corrente:
        endereco: 1
        quantidade: 1
      frequencia:
        endereco: 2
        quantidade: 1
  estacao_solar:
    tipo: estacao_solar
    host: 192.168.0.20
    porta: 502
    timeout: 3.0
    device_id: 1
    registradores:
      irradiancia:
        endereco: 100
        quantidade: 1
      temperatura_modulo:
        endereco: 101
        quantidade: 1
      temperatura_ambiente:
        endereco: 102
        quantidade: 1

logging:
  tipo: sqlite
  sqlite_path: dados_scada.db
  csv_path: dados_scada.csv
  intervalo_segundos: 5

mqtt:
  habilitado: true
  broker: broker.hivemq.com
  porta: 1883
  topico: usina/estacao/dados
  client_id: sistema-scada-local
  keepalive: 60
