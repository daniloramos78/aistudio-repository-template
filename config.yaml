equipamentos:
  inversor_principal:
    tipo: inversor
    host: 192.168.0.10
    porta: 502
    timeout: 3.0
    device_id: 1
    registradores:
      tensao:
        endereco: 0
        quantidade: 1
      corrente:
        endereco: 1
        quantidade: 1
      frequencia:
        endereco: 2
        quantidade: 1
  estacao_solar:
    tipo: estacao_solar
    host: 192.168.0.20
    porta: 502
    timeout: 3.0
    device_id: 1
    registradores:
      irradiancia:
        endereco: 100
        quantidade: 1
      temperatura_modulo:
        endereco: 101
        quantidade: 1
      temperatura_ambiente:
        endereco: 102
        quantidade: 1
  hukseflux_hb500:
    tipo: hukseflux_hb500
    host: 192.168.0.30
    porta: 502
    timeout: 3.0
    device_id: 1
    endereco_base_ai: 0
    escala_mv: 1.0
    signed: true
    canais:
      AI0:
        nome: irradiancia_global
        tipo: irradiancia
        sensibilidade_mv_por_wm2: 0.01
      AI1:
        nome: temperatura_modulo
        tipo: temperatura
        ganho_c_por_mv: 0.1
        offset_c: 0.0
      AI2:
        nome: temperatura_ambiente
        tipo: temperatura
        ganho_c_por_mv: 0.1
        offset_c: 0.0

logging:
  tipo: sqlite
  sqlite_path: dados_scada.db
  csv_path: dados_scada.csv
  intervalo_segundos: 5

mqtt:
  habilitado: true
  broker: broker.hivemq.com
  porta: 1883
  topico: usina/estacao/dados
  client_id: sistema-scada-local
  keepalive: 60
